<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#87c95f" />
    <meta name="description" content="AgroFarm 3D" />
    <title>AgroFarm 3D</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Fazenda 3D"></canvas>
      <header class="hud" aria-label="Informações da fazenda">
        <strong>AgroFarm</strong>
        <span>🪙 <b id="coins">100</b></span>
        <span>🏡 <b id="farm-level">1</b></span>
        <span>🎒 <b id="storage">0/10</b></span>
      </header>
      <section class="mission">
        <small>MISSÃO</small>
        <strong>Prepare o primeiro lote</strong>
        <span>Caminhe até a horta e prepare a terra.</span>
      </section>
      <div id="loading" class="loading">
        <div class="loading-card">
          <span class="logo">🌱</span>
          <h1>AgroFarm</h1>
          <p>Preparando a fazenda 3D...</p>
          <div class="progress"><i id="loading-progress"></i></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
