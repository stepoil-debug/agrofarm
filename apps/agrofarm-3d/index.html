<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#79b94f" />
    <meta name="description" content="AgroFarm — RPG de vida rural para computador e celular." />
    <title>AgroFarm</title>
  </head>
  <body>
    <main id="app">
      <div id="viewport" class="game-viewport">
        <svg id="farm-scene" viewBox="0 0 1600 900" role="img" aria-label="Fazenda AgroFarm jogável">
          <defs>
            <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#97d95f" />
              <stop offset="1" stop-color="#5fac42" />
            </linearGradient>
            <linearGradient id="path" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e8c184" />
              <stop offset="1" stop-color="#c99055" />
            </linearGradient>
            <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#73d5e9" />
              <stop offset="1" stop-color="#2e9fc1" />
            </linearGradient>
            <linearGradient id="roofRed" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e96a45" />
              <stop offset="1" stop-color="#a93628" />
            </linearGradient>
            <linearGradient id="roofBlue" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#567b89" />
              <stop offset="1" stop-color="#2f4d59" />
            </linearGradient>
            <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#c68a4d" />
              <stop offset="1" stop-color="#80502f" />
            </linearGradient>
            <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
              <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#183c1f" flood-opacity=".28" />
            </filter>
            <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="200%">
              <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#19361c" flood-opacity=".28" />
            </filter>
            <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="8" result="b" />
              <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
            <pattern id="roofTiles" width="24" height="16" patternUnits="userSpaceOnUse">
              <rect width="24" height="16" fill="#cf4b34" />
              <path d="M0 8h24M12 0v8M0 8l12 8 12-8" fill="none" stroke="#a8382d" stroke-width="2" opacity=".7" />
            </pattern>
          </defs>

          <rect width="1600" height="900" fill="#79c9ed" />
          <path class="farm-island" d="M35 10H1560Q1592 10 1590 43L1560 854Q1558 890 1520 893H65Q25 891 22 850L5 48Q3 12 35 10Z" fill="url(#grass)" />

          <g id="ground-details" opacity=".8">
            <path d="M0 130C180 74 350 107 510 62S875 36 1035 94s350 46 565-14" fill="none" stroke="#a8e873" stroke-width="52" opacity=".22" />
            <path d="M40 730C240 673 398 730 545 691s352-39 525 23 321 44 500-25" fill="none" stroke="#3d9140" stroke-width="65" opacity=".12" />
            <g fill="#b8ec77" opacity=".75">
              <circle cx="118" cy="155" r="4"/><circle cx="284" cy="94" r="5"/><circle cx="450" cy="170" r="4"/><circle cx="702" cy="75" r="5"/><circle cx="920" cy="126" r="4"/><circle cx="1284" cy="95" r="5"/><circle cx="1454" cy="173" r="4"/>
              <circle cx="134" cy="487" r="4"/><circle cx="333" cy="552" r="5"/><circle cx="698" cy="482" r="4"/><circle cx="1015" cy="590" r="5"/><circle cx="1368" cy="506" r="4"/><circle cx="1498" cy="665" r="5"/>
            </g>
          </g>

          <g id="paths" fill="none" stroke="url(#path)" stroke-linecap="round" stroke-linejoin="round">
            <path d="M797 257C794 330 760 363 737 414C713 467 740 521 814 557C886 592 1036 596 1102 640" stroke-width="66" />
            <path d="M735 424C623 428 525 423 424 448C333 471 287 522 252 596" stroke-width="54" />
            <path d="M816 557C705 594 637 648 582 734" stroke-width="58" />
            <path d="M868 559C1002 514 1136 475 1288 468" stroke-width="52" />
            <path d="M1080 635C1185 674 1240 731 1290 814" stroke-width="52" />

          <g fill="none" stroke="#f5d59f" stroke-width="5" stroke-linecap="round" opacity=".45">
            <path d="M797 262C790 340 749 376 736 422C725 469 756 512 823 546" />
            <path d="M728 432C612 433 510 439 421 458C337 477 299 526 267 586" />
          </g>

          <g id="river">
            <path d="M-10 730C115 670 194 688 273 742C352 796 432 824 547 799C657 776 700 810 760 906H-10Z" fill="url(#water)" />
            <path d="M-10 748C112 692 186 708 260 758C350 820 421 837 533 815" fill="none" stroke="#a9eff4" stroke-width="10" opacity=".7" />
            <g fill="#87d36c"><ellipse cx="124" cy="788" rx="24" ry="11"/><ellipse cx="201" cy="736" rx="18" ry="9"/><ellipse cx="481" cy="825" rx="22" ry="10"/></g>
            <g fill="#eaf7ff" class="duck-family"><ellipse cx="92" cy="752" rx="17" ry="10"/><circle cx="105" cy="746" r="8"/><path d="M112 747l11 4-11 4" fill="#efad3a"/><ellipse cx="145" cy="772" rx="11" ry="7"/><circle cx="153" cy="768" r="5"/></g>
          </g>

          <g id="bridge" filter="url(#smallShadow)">

            <path d="M405 795Q474 747 548 790" fill="none" stroke="#74411f" stroke-width="10" />
            <g stroke="#8b552e" stroke-width="5">
              <path d="M417 777l15-10M435 785l15-12M454 790l16-12M474 792l16-12M495 789l15-12M515 783l15-11M534 775l13-8" />
            </g>
            <path d="M415 785Q480 740 542 782" fill="none" stroke="#bb7a42" stroke-width="35" />
          </g>

          <g id="orchard" class="decor-layer"></g>
          <g id="flowers" class="decor-layer"></g>

          <g id="house" data-building="house" class="building" filter="url(#softShadow)">
            <ellipse cx="790" cy="280" rx="146" ry="42" fill="#2f722e" opacity=".3" />
            <rect x="682" y="150" width="220" height="130" rx="8" fill="#f2d49c" stroke="#c38e52" stroke-width="5" />
            <path d="M655 166L793 70l142 96-25 15-117-76-116 76Z" fill="url(#roofTiles)" stroke="#a83e2e" stroke-width="6" />
            <path d="M685 154L793 78l109 76" fill="none" stroke="#f7bd73" stroke-width="6" />
            <rect x="743" y="189" width="48" height="91" rx="4" fill="#86502c" />
            <rect x="706" y="188" width="33" height="42" rx="4" fill="#8fd3d4" stroke="#397d7b" stroke-width="5" />
            <rect x="840" y="188" width="33" height="42" rx="4" fill="#8fd3d4" stroke="#397d7b" stroke-width="5" />
            <rect x="665" y="264" width="258" height="20" rx="8" fill="#f8e5bd" />
            <g stroke="#e7d3ad" stroke-width="8"><path d="M685 244v53M716 244v53M867 244v53M899 244v53" /></g>
            <path d="M740 280Q790 315 839 280" fill="#d8ad70" />
            <g class="window-glow" opacity=".5"><rect x="710" y="192" width="25" height="34" rx="3" fill="#fff9b3"/><rect x="844" y="192" width="25" height="34" rx="3" fill="#fff9b3"/></g>
            <g class="flower-box"><rect x="695" y="234" width="52" height="12" rx="5" fill="#8c5a32"/><circle cx="706" cy="232" r="7" fill="#f16682"/><circle cx="720" cy="230" r="8" fill="#ffd45e"/><circle cx="736" cy="233" r="7" fill="#9a6ee8"/></g>
          </g>

          <g id="well" filter="url(#smallShadow)">
            <ellipse cx="604" cy="285" rx="42" ry="18" fill="#75533e" opacity=".2"/>
            <ellipse cx="604" cy="262" rx="37" ry="18" fill="#9d8d79" stroke="#665b4e" stroke-width="5" />
            <rect x="571" y="255" width="66" height="32" rx="12" fill="#9d8d79" />
            <path d="M572 244Q604 210 637 244" fill="none" stroke="#7f532f" stroke-width="10" />
            <path d="M565 244h77" stroke="#5e3b25" stroke-width="8" />
          </g>

          <g id="barn" data-building="barn" class="building" filter="url(#softShadow)">
            <ellipse cx="1190" cy="300" rx="158" ry="46" fill="#2e6c2d" opacity=".3" />
            <rect x="1074" y="165" width="210" height="146" rx="8" fill="#bc4436" stroke="#843125" stroke-width="6" />
            <path d="M1044 177L1177 78l138 99-24 20-114-82-112 82Z" fill="url(#roofBlue)" stroke="#2c454d" stroke-width="7" />
            <rect x="1135" y="215" width="84" height="96" rx="4" fill="#f2ead2" stroke="#8d342d" stroke-width="7" />
            <path d="M1139 220l76 84M1215 220l-76 84" stroke="#c24e43" stroke-width="10" />
            <rect x="1110" y="180" width="52" height="34" fill="#f4ead0" /><path d="M1112 183l48 28M1160 183l-48 28" stroke="#b94538" stroke-width="6"/>
            <g id="hay-bales"><rect x="1020" y="278" width="66" height="35" rx="8" fill="#e2bb45"/><rect x="1030" y="244" width="58" height="35" rx="8" fill="#efc853"/><path d="M1038 244v69M1065 244v69" stroke="#b38b2f" stroke-width="5"/></g>
          </g>

          <g id="silo" filter="url(#softShadow)">
            <rect x="1300" y="143" width="72" height="164" rx="34" fill="#b8c0bc" stroke="#77827e" stroke-width="5" />
            <path d="M1300 160Q1336 110 1372 160" fill="#89938f" stroke="#68716e" stroke-width="5" />
            <path d="M1311 182h50M1308 215h56M1307 249h58" stroke="#8f9995" stroke-width="4" opacity=".7" />
          </g>

          <g id="workshop" data-building="workshop" class="building" filter="url(#softShadow)">
            <ellipse cx="370" cy="330" rx="142" ry="42" fill="#2f722e" opacity=".28" />
            <rect x="260" y="213" width="221" height="125" rx="8" fill="#d4b77c" stroke="#8b683e" stroke-width="6" />
            <path d="M235 225L365 140l143 85-25 19-118-67-110 67Z" fill="#568263" stroke="#365b48" stroke-width="7" />
            <rect x="307" y="247" width="98" height="91" fill="#704a2f" />
            <rect x="420" y="245" width="44" height="56" rx="4" fill="#7dc9d4" stroke="#396e74" stroke-width="5" />
            <rect x="270" y="257" width="36" height="72" fill="#b1834e" />
            <g class="workshop-props"><rect x="215" y="304" width="58" height="32" rx="7" fill="#8f5f36"/><circle cx="233" cy="337" r="12" fill="#4a423a"/><circle cx="265" cy="337" r="12" fill="#4a423a"/><rect x="452" y="306" width="39" height="30" rx="6" fill="#7498a0"/></g>
          </g>

          <g id="fields" filter="url(#smallShadow)">
            <path d="M220 430Q400 367 621 405L644 594Q408 641 194 576Z" fill="#7d4f2d" stroke="#f0d19a" stroke-width="11" />
            <path d="M227 446Q397 391 610 421" fill="none" stroke="#ae7141" stroke-width="8" />
            <path d="M220 485Q402 432 618 461M213 524Q398 474 627 503M207 561Q403 518 633 544" fill="none" stroke="#a76a3d" stroke-width="6" opacity=".8" />
            <g id="plots-layer"></g>
          </g>

          <g id="pasture" data-building="pasture" filter="url(#smallShadow)">
            <path d="M884 326Q1093 270 1261 368L1217 550Q1038 591 861 509Z" fill="#72b958" stroke="#f0d19a" stroke-width="10" />
            <path d="M892 335L1253 374M1211 541L870 502" stroke="#8e5d37" stroke-width="10" stroke-dasharray="28 16" />
            <path d="M892 335L870 502M1253 374L1211 541" stroke="#8e5d37" stroke-width="10" stroke-dasharray="28 16" />
            <g class="cow cow-one" transform="translate(958 390)"><ellipse cx="0" cy="0" rx="47" ry="25" fill="#f8f3e7"/><circle cx="41" cy="-4" r="19" fill="#f8f3e7"/><path d="M-25-18q18 5 25 0v29q-20-6-29 0Z" fill="#4b4139"/><path d="M33-12q12 3 22 0v17q-10-3-22 1Z" fill="#4b4139"/><path d="M-25 18v28M18 18v28M35 12v29" stroke="#5b493d" stroke-width="8"/><circle cx="48" cy="-8" r="3" fill="#222"/></g>
            <g class="cow cow-two" transform="translate(1100 438) scale(.92)"><ellipse cx="0" cy="0" rx="47" ry="25" fill="#f8f3e7"/><circle cx="41" cy="-4" r="19" fill="#f8f3e7"/><path d="M-24-18q20 8 29 2v28q-18-5-30 1Z" fill="#4b4139"/><path d="M-24 18v28M18 18v28M35 12v29" stroke="#5b493d" stroke-width="8"/><circle cx="48" cy="-8" r="3" fill="#222"/></g>
            <g class="cow cow-three" transform="translate(1188 370) scale(.82)"><ellipse cx="0" cy="0" rx="47" ry="25" fill="#f8f3e7"/><circle cx="41" cy="-4" r="19" fill="#f8f3e7"/><path d="M-5-22q20 6 30 2v29q-18-4-31 1Z" fill="#4b4139"/><path d="M-24 18v28M18 18v28M35 12v29" stroke="#5b493d" stroke-width="8"/></g>
            <rect x="1022" y="478" width="76" height="28" rx="12" fill="#5bb9dc" stroke="#d7f2f7" stroke-width="5" />
            <path d="M901 414q35-44 71-10" fill="none" stroke="#6d472d" stroke-width="10" /><path d="M900 408h74" stroke="#8c5d38" stroke-width="10" />
          </g>

          <g id="market" data-building="market" class="building" filter="url(#softShadow)">
            <ellipse cx="797" cy="700" rx="130" ry="38" fill="#2f722e" opacity=".28" />
            <rect x="690" y="633" width="214" height="95" rx="9" fill="#9a6638" stroke="#714625" stroke-width="6" />
            <path d="M672 634h251l-24-65H697Z" fill="#f5e4bf" stroke="#9c6035" stroke-width="6" />
            <path d="M690 571v62M732 571v62M774 571v62M816 571v62M858 571v62M900 571v62" stroke="#df5747" stroke-width="23" />
            <rect x="710" y="665" width="174" height="38" rx="7" fill="#7d4c2a" />
            <g class="produce"><circle cx="737" cy="666" r="14" fill="#e85a45"/><circle cx="765" cy="665" r="14" fill="#f3b43d"/><circle cx="793" cy="666" r="14" fill="#75a84b"/><circle cx="822" cy="665" r="14" fill="#db4d3a"/><circle cx="850" cy="666" r="14" fill="#efca4e"/></g>
            <rect x="650" y="661" width="33" height="65" rx="4" fill="#5f432d"/><path d="M656 675h21M656 687h21M656 699h21" stroke="#e6d6b7" stroke-width="3"/>
          </g>

          <g id="coop" filter="url(#softShadow)">
            <path d="M1124 671h186v127h-186Z" fill="#d7a65b" stroke="#8c5e32" stroke-width="6" />
            <path d="M1106 680l112-73 112 73-17 16-95-58-94 58Z" fill="url(#roofRed)" stroke="#9e362a" stroke-width="6" />
            <rect x="1176" y="710" width="78" height="88" fill="#8b5931" />
            <g class="chickens"><g transform="translate(1090 745)"><ellipse rx="18" ry="13" fill="#fff4dd"/><circle cx="15" cy="-7" r="9" fill="#fff4dd"/><path d="M23-7l11 4-11 4" fill="#e7a037"/><path d="M-7 12v15M8 12v15" stroke="#d19539" stroke-width="4"/></g><g transform="translate(1348 760) scale(.9)"><ellipse rx="18" ry="13" fill="#fff4dd"/><circle cx="15" cy="-7" r="9" fill="#fff4dd"/><path d="M23-7l11 4-11 4" fill="#e7a037"/></g></g>
          </g>

          <g id="props" class="decor-layer">
            <g transform="translate(1370 530)" filter="url(#smallShadow)"><rect width="82" height="58" rx="8" fill="#9c683d"/><path d="M10 15h62M10 29h62M10 43h62" stroke="#d9b07a" stroke-width="5"/><circle cx="14" cy="61" r="13" fill="#4e463f"/><circle cx="67" cy="61" r="13" fill="#4e463f"/></g>
            <g transform="translate(520 300)"><rect width="58" height="42" rx="8" fill="#c88e4b"/><path d="M8 9h42M8 21h42M8 33h42" stroke="#8a5b34" stroke-width="5"/></g>
            <g transform="translate(1288 615)"><rect width="55" height="70" rx="7" fill="#755035"/><path d="M10 10h35M10 24h35M10 38h35" stroke="#f0deb9" stroke-width="4"/></g>
          </g>

          <g id="trees-layer"></g>
          <g id="flower-layer"></g>

          <g id="farmer" transform="translate(780 484)" filter="url(#smallShadow)">
            <ellipse cy="31" rx="24" ry="9" fill="#254b2d" opacity=".35" />
            <circle cy="-28" r="16" fill="#d49b70" />
            <path d="M-22-36Q0-54 22-36L15-30H-15Z" fill="#d4a54d" stroke="#916d34" stroke-width="3" />
            <path d="M-13-12h26l8 36H-21Z" fill="#2f78a2" />
            <path d="M-15-12h30v16h-30Z" fill="#cb4d3d" />
            <path d="M-13 24l-8 28M13 24l8 28" stroke="#4a4139" stroke-width="8" stroke-linecap="round" />
            <path d="M-16-4l-22 22M16-4l22 22" stroke="#d49b70" stroke-width="7" stroke-linecap="round" />
          </g>

          <circle id="move-marker" cx="780" cy="484" r="18" fill="none" stroke="#fff6a4" stroke-width="6" opacity="0" />
          <rect id="interaction-catcher" width="1600" height="900" fill="transparent" />
        </svg>
      </div>

      <header class="top-hud panel" aria-label="Informações da fazenda">
        <div class="brand"><span class="brand-mark">🌱</span><strong>AgroFarm</strong></div>
        <div class="stat"><span>🪙</span><b id="coins">100,00</b></div>
        <div class="stat"><span>🏡</span><b id="farm-level">LV 1</b></div>
        <div class="stat"><span>📦</span><b id="storage">0/10</b></div>
        <div class="stat weather"><span id="weather-icon">☀️</span><b id="clock">08:00</b></div>
        <button id="mode-button" class="pill-button" type="button">Livre</button>
        <button id="menu-button" class="round-button" type="button" aria-label="Abrir menu">☰</button>
      </header>

      <section class="mission panel" aria-live="polite">
        <span class="mission-icon">📋</span>
        <div><small>MISSÃO ATUAL</small><strong id="mission-title">Prepare o primeiro terreno</strong><div class="mission-progress"><i id="mission-progress"></i></div><span id="mission-text">Escolha a enxada e clique ou toque em um lote.</span></div>
      </section>

      <nav id="crop-picker" class="crop-picker panel" aria-label="Escolher cultura">
        <button class="crop selected" data-crop="corn" type="button"><span>🌽</span><b>Milho</b></button>
        <button class="crop" data-crop="cassava" type="button"><span>🌿</span><b>Mandioca</b></button>
        <button class="crop" data-crop="pineapple" type="button"><span>🍍</span><b>Abacaxi</b></button>
      </nav>

      <nav id="toolbar" class="toolbar panel" aria-label="Ferramentas">
        <button class="tool active" data-tool="hoe" type="button"><span>⛏️</span><small>Enxada</small><em>1</em></button>
        <button class="tool" data-tool="seed" type="button"><span>🌱</span><small>Plantar</small><em>2</em></button>
        <button class="tool" data-tool="water" type="button"><span>💧</span><small>Regar</small><em>3</em></button>
        <button class="tool" data-tool="protect" type="button"><span>🛡️</span><small>Defensivo</small><em>4</em></button>
        <button class="tool" data-tool="harvest" type="button"><span>🧺</span><small>Colher</small><em>5</em></button>
      </nav>

      <div class="zoom-controls panel" aria-label="Controles de câmera">
        <button id="zoom-in" type="button" aria-label="Aproximar">＋</button>
        <button id="camera-home" type="button" aria-label="Centralizar">⌂</button>
        <button id="zoom-out" type="button" aria-label="Afastar">−</button>
      </div>

      <div id="toast" class="toast hidden" role="status"></div>
      <section id="dialog" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><button class="modal-close" type="button" aria-label="Fechar">×</button><div id="dialog-content"></div></div></section>
      <section id="loading" class="loading"><div class="loading-card"><span class="loading-logo">🌱</span><p class="eyebrow">UMA VIDA NO CAMPO</p><h1>AgroFarm</h1><p>Preparando sua fazenda...</p><div class="progress"><i></i></div><button id="play-button" class="play-button" type="button">Entrar na fazenda</button><small>Clique ou toque para caminhar e interagir</small></div></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
