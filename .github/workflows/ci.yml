name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "rewrite/**"]
  pull_request:
    branches: [main]

jobs:
  validate-godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.1
      GODOT_STATUS: stable
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Godot
        run: |
          curl -L --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Instalar templates de exportação
        run: |
          curl -L --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      - name: Importar e validar scripts
        run: |
          timeout 90 godot --headless --path apps/agrofarm-godot --editor --quit

      - name: Executar smoke test da cena
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path apps/agrofarm-godot --quit-after 4 2>&1 | tee /tmp/agrofarm-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Attempt to call|Cannot call method|not previously assigned" /tmp/agrofarm-runtime.log; then
            echo "Falha de execução detectada no jogo."
            exit 1
          fi

      - name: Exportar versão Web
        run: |
          mkdir -p dist
          godot --headless --path apps/agrofarm-godot --export-release Web ../../dist/index.html
          test -f dist/index.html
          test -f dist/index.wasm
