name: Deploy AgroFarm Site

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/classic-deploy.yml
      - site/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar site
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/manifest.json
          test -f site/sw.js
          touch site/.nojekyll
          find site -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar AgroFarm Site
        id: deployment
        uses: actions/deploy-pages@v4
