name: Deploy AgroFarm Classic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/classic-deploy.yml
      - scripts/prepare-classic.py
      - scripts/mobile-farm-patch.py
      - scripts/mobile-legibility-patch.py
      - scripts/mobile-legibility-postfix.py
      - scripts/enhanced-systems-patch.py
      - scripts/enhanced-gdscript-postfix.py
      - scripts/enhanced-config-postfix.py
      - scripts/farm-progression-patch.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: 3.6.2
  GODOT_STATUS: stable
  UPSTREAM_COMMIT: 8d9ccc4e49ad86b22eb38a9e00ddfa60150cd00c

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório AgroFarm
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Baixar base funcional
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/Kenny-Haworth/Harvest-Moon-2.0.git /tmp/harvest-base
          cd /tmp/harvest-base
          git fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git checkout --detach "$UPSTREAM_COMMIT"
          test -f "Harvest Moon 2.0/project.godot"

      - name: Modelar base para o AgroFarm
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/prepare-classic.py')
          text = path.read_text(encoding='utf-8')
          start = text.find('    # Quando a próxima célula está bloqueada')
          end_marker = '    text = text.replace(next_marker, next_replacement, 1)\n'
          end = text.find(end_marker, start)
          if start >= 0 and end >= 0:
              end += len(end_marker)
              text = text[:start] + text[end:]
              path.write_text(text, encoding='utf-8')
          PY
          PROJECT="/tmp/harvest-base/Harvest Moon 2.0"
          python3 scripts/prepare-classic.py "$PROJECT"
          python3 scripts/enhanced-systems-patch.py "$PROJECT"
          python3 scripts/enhanced-gdscript-postfix.py "$PROJECT"
          python3 scripts/enhanced-config-postfix.py "$PROJECT"
          python3 scripts/mobile-farm-patch.py "$PROJECT"
          python3 scripts/mobile-legibility-patch.py "$PROJECT"
          python3 scripts/mobile-legibility-postfix.py "$PROJECT"
          python3 scripts/farm-progression-patch.py "$PROJECT"

      - name: Restaurar cache dos efeitos sonoros
        run: |
          set -euo pipefail
          cd /tmp/harvest-base
          git checkout "$UPSTREAM_COMMIT" -- "Harvest Moon 2.0/.import"
          test -f "Harvest Moon 2.0/.import/bell.wav-c0276555e83dc3997cf546dab5593db3.sample"

      - name: Instalar Godot 3.6.2
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux_headless.64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux_headless.64"
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux_headless.64" /usr/local/bin/godot3
          godot3 --version

      - name: Instalar templates HTML5
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          rm -rf /tmp/export-templates
          mkdir -p /tmp/export-templates
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          for destination in \
            "$HOME/.local/share/godot/templates/${GODOT_VERSION}.${GODOT_STATUS}" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"; do
            mkdir -p "$destination"
            cp -R /tmp/export-templates/templates/. "$destination/"
          done

      - name: Importar e validar projeto
        run: |
          set -o pipefail
          PROJECT="/tmp/harvest-base/Harvest Moon 2.0"
          timeout 300 godot3 --path "$PROJECT" --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load|Cannot open file" /tmp/godot-import.log; then
            echo "Falha durante a importação do projeto."
            exit 1
          fi

      - name: Exportar jogo para navegador
        run: |
          set -euo pipefail
          PROJECT="/tmp/harvest-base/Harvest Moon 2.0"
          mkdir -p "$GITHUB_WORKSPACE/site"
          godot3 --path "$PROJECT" --export "HTML5" "$GITHUB_WORKSPACE/site/index.html"
          touch "$GITHUB_WORKSPACE/site/.nojekyll"
          test -f "$GITHUB_WORKSPACE/site/index.html"
          test -f "$GITHUB_WORKSPACE/site/index.js"
          test -f "$GITHUB_WORKSPACE/site/index.wasm"
          test -f "$GITHUB_WORKSPACE/site/index.pck"
          if [ -d "$PROJECT/pwa" ]; then
            cp "$PROJECT/pwa/manifest.json" "$GITHUB_WORKSPACE/site/manifest.json"
            cp "$PROJECT/pwa/sw.js" "$GITHUB_WORKSPACE/site/sw.js"
            python3 - <<'PY'
          from pathlib import Path
          html_path = Path('site/index.html')
          html = html_path.read_text(encoding='utf-8')
          inject = '<link rel="manifest" href="manifest.json"><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>'
          if 'manifest.json' not in html:
              html = html.replace('</head>', inject + '</head>') if '</head>' in html else inject + html
          html_path.write_text(html, encoding='utf-8')
          PY
          fi
          du -sh "$GITHUB_WORKSPACE/site"
          find "$GITHUB_WORKSPACE/site" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar jogo
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar AgroFarm Classic
        id: deployment
        uses: actions/deploy-pages@v4

  status:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    permissions:
      contents: write
    steps:
      - name: Baixar repositório AgroFarm
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Registrar status da publicação
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          status = os.environ.get('WORKFLOW_STATUS', 'unknown')
          conclusion = os.environ.get('WORKFLOW_CONCLUSION', 'unknown')
          url = 'https://stepoil-debug.github.io/agrofarm/'
          http_code = None
          title = ''
          contains_godot_export = False
          contains_agrofarm_classic = False
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  http_code = response.status
                  html = response.read(600000).decode('utf-8', errors='ignore')
                  import re
                  m = re.search(r'<title>(.*?)</title>', html, re.I | re.S)
                  title = m.group(1).strip() if m else ''
                  contains_godot_export = 'index.wasm' in html or 'Godot' in html
                  contains_agrofarm_classic = 'AgroFarm' in html or 'agrofarm' in html.lower()
          except Exception as exc:
              http_code = 'error: ' + str(exc)
          data = {
              'checked_at': os.environ.get('CHECKED_AT'),
              'workflow': {
                  'id': int(os.environ.get('GITHUB_RUN_ID', '0')),
                  'status': status,
                  'conclusion': conclusion,
                  'url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
                  'head_sha': os.environ.get('GITHUB_SHA'),
              },
              'site': {
                  'url': url,
                  'http_code': http_code,
                  'title': title,
                  'contains_godot_export': contains_godot_export,
                  'contains_agrofarm_classic': contains_agrofarm_classic,
              }
          }
          from pathlib import Path
          Path('deployment-status').mkdir(exist_ok=True)
          Path('deployment-status/classic.json').write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
        env:
          CHECKED_AT: ${{ github.event.head_commit.timestamp }}
          WORKFLOW_STATUS: completed
          WORKFLOW_CONCLUSION: ${{ needs.deploy.result }}

      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status/classic.json
          git commit -m "ci: atualizar status da publicação classic [skip ci]" || exit 0
          git push
