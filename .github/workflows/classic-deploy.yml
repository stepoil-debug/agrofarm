name: Deploy AgroFarm Classic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/classic-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 3.6.2
  GODOT_STATUS: stable
  UPSTREAM_COMMIT: 8d9ccc4e49ad86b22eb38a9e00ddfa60150cd00c

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório AgroFarm
        uses: actions/checkout@v4

      - name: Baixar base funcional
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Kenny-Haworth/Harvest-Moon-2.0.git /tmp/harvest-base
          cd /tmp/harvest-base
          git fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git checkout --detach "$UPSTREAM_COMMIT"
          test -f "Harvest Moon 2.0/project.godot"

      - name: Preparar identidade e economia AgroFarm
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="/tmp/harvest-base/Harvest Moon 2.0"

          rm -rf "$PROJECT/.import"
          rm -f "$PROJECT/Boot Splash and Icon/Harvest Moon Boot Splash.png" \
                "$PROJECT/Boot Splash and Icon/Harvest Moon Boot Splash.png.import" \
                "$PROJECT/Boot Splash and Icon/Harvest Moon Boot Splash Test.png.import" \
                "$PROJECT/Boot Splash and Icon/rcedit-x64.exe"

          for audio in farm forceSleep house rain titleScreen town; do
            ffmpeg -hide_banner -loglevel error -y \
              -i "$PROJECT/sound/music/${audio}.wav" \
              -c:a libvorbis -q:a 3 \
              "$PROJECT/sound/music/${audio}.ogg"
            rm -f "$PROJECT/sound/music/${audio}.wav" "$PROJECT/sound/music/${audio}.wav.import"
          done

          export AGROFARM_PROJECT="$PROJECT"
          python3 <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["AGROFARM_PROJECT"])

          def replace(path: str, old: str, new: str, count: int = -1) -> None:
              file = root / path
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Trecho não encontrado em {path}: {old[:80]!r}")
              text = text.replace(old, new, count)
              file.write_text(text, encoding="utf-8")

          project = root / "project.godot"
          text = project.read_text(encoding="utf-8")
          text = text.replace('config/name="Harvest Moon 2.0"', 'config/name="AgroFarm Classic"')
          text = text.replace('boot_splash/image="res://Boot Splash and Icon/Harvest Moon Boot Splash.png"\n', '')
          text = text.replace('GameManager="*res://save_load/GameManager.gd"', 'GameManager="*res://save_load/GameManager.gd"\nAgroFarmConfig="*res://config/AgroFarmConfig.gd"')
          text = text.replace('window/size/width=1366', 'window/size/width=1280')
          text = text.replace('window/size/height=768', 'window/size/height=720')
          text = text.replace('window/stretch/mode="viewport"', 'window/stretch/mode="viewport"\nwindow/stretch/aspect="keep"\nwindow/handheld/orientation="landscape"')
          text += '\n[input_devices]\n\npointing/emulate_touch_from_mouse=true\npointing/emulate_mouse_from_touch=true\n'
          project.write_text(text, encoding="utf-8")

          config_dir = root / "config"
          config_dir.mkdir(exist_ok=True)
          (config_dir / "AgroFarmConfig.gd").write_text('''extends Node

const GAME_TITLE = "AgroFarm Classic"
const STARTING_COINS = 100
const INITIAL_STORAGE_CAPACITY = 10

const ITEM_DISPLAY_NAMES = {
    "Gold": "moedas",
    "TurnipSeeds": "sementes de milho",
    "StrawberrySeeds": "mudas de mandioca",
    "EggplantSeeds": "mudas de abacaxi",
    "Turnip": "milho",
    "Strawberry": "mandioca",
    "Eggplant": "abacaxi",
    "Watering Can": "regador",
    "Hoe": "enxada",
    "Axe": "machado",
    "Hammer": "martelo",
    "Sickle": "foice"
}

const CROP_CONFIG = {
    "Turnip": {"display_name": "Milho", "free_duration_seconds": 34, "realistic_duration_seconds": 7200, "seed_cost": 2, "base_sale": 3},
    "Strawberry": {"display_name": "Mandioca", "free_duration_seconds": 46, "realistic_duration_seconds": 14400, "seed_cost": 4, "base_sale": 6},
    "Eggplant": {"display_name": "Abacaxi", "free_duration_seconds": 64, "realistic_duration_seconds": 21600, "seed_cost": 7, "base_sale": 10}
}

const FARM_LEVELS = [
    {"level": 1, "upgrade_cost": 0, "margin_cap": 0.02},
    {"level": 2, "upgrade_cost": 150, "margin_cap": 0.04},
    {"level": 3, "upgrade_cost": 300, "margin_cap": 0.06},
    {"level": 4, "upgrade_cost": 600, "margin_cap": 0.08},
    {"level": 5, "upgrade_cost": 1000, "margin_cap": 0.10}
]

const EXPANSION_COSTS = [120, 250, 500, 900, 1500]

func get_item_display_name(item_id):
    return ITEM_DISPLAY_NAMES.get(item_id, item_id)
''', encoding="utf-8")

          replace("Game.tscn", "res://sound/music/farm.wav", "res://sound/music/farm.ogg")
          replace("Game.tscn", "res://sound/music/house.wav", "res://sound/music/house.ogg")
          replace("Game.tscn", "res://sound/music/town.wav", "res://sound/music/town.ogg")
          replace("Game.tscn", "res://sound/music/rain.wav", "res://sound/music/rain.ogg")
          replace("Game.tscn", "res://sound/music/forceSleep.wav", "res://sound/music/forceSleep.ogg")

          menu = root / "menus/main/MainMenu.tscn"
          menu_text = menu.read_text(encoding="utf-8")
          menu_text = menu_text.replace("res://sound/music/titleScreen.wav", "res://sound/music/titleScreen.ogg")
          menu_text = menu_text.replace('text = "New Game"', 'text = "Novo jogo"')
          menu_text = menu_text.replace('text = "Load Game"', 'text = "Carregar jogo"')
          menu_text = menu_text.replace('text = "Controls"', 'text = "Controles"')
          menu_text = menu_text.replace('text = "Graphics"', 'text = "Gráficos"')
          menu_text = menu_text.replace('text = "Quit to Desktop"', 'text = "Sair"')
          marker = '[node name="Buttons" type="VBoxContainer" parent="." index="1"]'
          title_node = '''[node name="AgroFarmTitle" type="Label" parent="."]

anchor_left = 0.5
anchor_top = 0.12
anchor_right = 0.5
anchor_bottom = 0.12
margin_left = -260.0
margin_top = -35.0
margin_right = 260.0
margin_bottom = 35.0
text = "AGROFARM CLASSIC"
align = 1
valign = 1

'''
          if marker not in menu_text:
              raise SystemExit("Não foi possível localizar o container do menu principal")
          menu_text = menu_text.replace(marker, title_node + marker, 1)
          menu.write_text(menu_text, encoding="utf-8")

          replace("menus/shop/Buy/Buy.gd",
                  'const buyableItems = {"Sickle":50, "Axe":200, "Hammer":500, "TurnipSeeds":5, "StrawberrySeeds":10, "EggplantSeeds":20}',
                  'const buyableItems = {"Sickle":50, "Axe":120, "Hammer":140, "TurnipSeeds":2, "StrawberrySeeds":4, "EggplantSeeds":7}')

          replace("menus/shop/Sell/Sell.gd",
                  'const sellableItems = {"Sickle":10, "Axe":50, "Hammer":150, "Turnip":10, "Strawberry":20, "Eggplant":45, "TurnipSeeds":1, "StrawberrySeeds":2, "EggplantSeeds":5}',
                  'const sellableItems = {"Sickle":10, "Axe":50, "Hammer":60, "Turnip":3, "Strawberry":6, "Eggplant":10, "TurnipSeeds":1, "StrawberrySeeds":1, "EggplantSeeds":2}')

          sell = root / "menus/shop/Sell/Sell.gd"
          sell_text = sell.read_text(encoding="utf-8")
          start = sell_text.index('\tYou_Currently_Have.get("custom_fonts/font").size = 100')
          end = sell_text.index('\n#updates the amount and total cost labels', start)
          sell_text = sell_text[:start] + '''\tYou_Currently_Have.get("custom_fonts/font").size = 80
\tvar item_id = currentItems.keys()[indicator_position-1]
\tvar number = Inventory.get_amount(item_id)
\tvar display_name = AgroFarmConfig.get_item_display_name(item_id)
\tYou_Currently_Have.set_text(str(number) + " " + display_name)
''' + sell_text[end:]
          sell.write_text(sell_text, encoding="utf-8")

          replace("ui/inventory/Inventory.gd",
                  'var stacked_items = {"StrawberrySeeds":18, "Gold":10}',
                  'var stacked_items = {"TurnipSeeds":9, "Gold":100}')
          replace("ui/inventory/Inventory.tscn",
                  'res://ui/inventory/tools and items/StrawberrySeeds.png',
                  'res://ui/inventory/tools and items/TurnipSeeds.png')
          replace("ui/inventory/Inventory.tscn", 'text = "18"', 'text = "9"', 1)
          replace("ui/inventory/Inventory.tscn", 'text = "10"', 'text = "100"', 1)

          (root / "export_presets.cfg").write_text('''[preset.0]

name="HTML5"
platform="HTML5"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
patch_list=PoolStringArray(  )
script_export_mode=1
script_encryption_key=""

[preset.0.options]

vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\\"theme-color\\" content=\\"#315f38\\"><meta name=\\"description\\" content=\\"AgroFarm Classic — jogo rural em desenvolvimento.\\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=3
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
''', encoding="utf-8")
          PY

      - name: Instalar Godot 3.6.2
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux_headless.64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux_headless.64"
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux_headless.64" /usr/local/bin/godot3
          godot3 --version

      - name: Instalar templates HTML5
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          rm -rf /tmp/export-templates
          mkdir -p /tmp/export-templates
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          for destination in \
            "$HOME/.local/share/godot/templates/${GODOT_VERSION}.${GODOT_STATUS}" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"; do
            mkdir -p "$destination"
            cp -R /tmp/export-templates/templates/. "$destination/"
          done

      - name: Importar e validar projeto
        run: |
          set -o pipefail
          PROJECT="/tmp/harvest-base/Harvest Moon 2.0"
          timeout 300 godot3 --path "$PROJECT" --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load|Cannot open file" /tmp/godot-import.log; then
            echo "Falha durante a importação do projeto."
            exit 1
          fi

      - name: Exportar jogo para navegador
        run: |
          set -euo pipefail
          PROJECT="/tmp/harvest-base/Harvest Moon 2.0"
          mkdir -p "$GITHUB_WORKSPACE/site"
          godot3 --path "$PROJECT" --export "HTML5" "$GITHUB_WORKSPACE/site/index.html"
          touch "$GITHUB_WORKSPACE/site/.nojekyll"
          test -f "$GITHUB_WORKSPACE/site/index.html"
          test -f "$GITHUB_WORKSPACE/site/index.js"
          test -f "$GITHUB_WORKSPACE/site/index.wasm"
          test -f "$GITHUB_WORKSPACE/site/index.pck"
          du -sh "$GITHUB_WORKSPACE/site"
          find "$GITHUB_WORKSPACE/site" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar pacote do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar AgroFarm Classic
        id: deployment
        uses: actions/deploy-pages@v4
