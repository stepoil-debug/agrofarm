name: Diagnose AgroFarm Workflows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/actions-diagnostic.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Coletar workflows e execuções
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p deployment-status
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" > /tmp/workflows.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" > /tmp/runs.json

          jq '{workflows:[.workflows[]|{id,name,path,state}]}' /tmp/workflows.json > /tmp/workflows-small.json
          jq '{runs:[.workflow_runs[]|{id,name,path,event,status,conclusion,head_sha,run_number,html_url,created_at,updated_at}]}' /tmp/runs.json > /tmp/runs-small.json

          CLASSIC_ID=$(jq -r '.workflows[] | select(.path==".github/workflows/classic-deploy.yml") | .id' /tmp/workflows.json | head -1)
          if [ -n "$CLASSIC_ID" ]; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${CLASSIC_ID}/runs?per_page=10" > /tmp/classic-runs.json
          else
            echo '{"workflow_runs":[]}' > /tmp/classic-runs.json
          fi

          LATEST_CLASSIC_RUN=$(jq -r '.workflow_runs[0].id // 0' /tmp/classic-runs.json)
          if [ "$LATEST_CLASSIC_RUN" != "0" ]; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${LATEST_CLASSIC_RUN}/jobs?per_page=100" > /tmp/classic-jobs.json
          else
            echo '{"jobs":[]}' > /tmp/classic-jobs.json
          fi

          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile workflows /tmp/workflows-small.json \
            --slurpfile runs /tmp/runs-small.json \
            --slurpfile classic /tmp/classic-runs.json \
            --slurpfile jobs /tmp/classic-jobs.json \
            '{checked_at:$checked_at,workflows:$workflows[0].workflows,recent_runs:$runs[0].runs,classic_runs:[$classic[0].workflow_runs[]|{id,name,path,event,status,conclusion,head_sha,run_number,html_url,created_at,updated_at}],classic_jobs:[$jobs[0].jobs[]|{id,name,status,conclusion,html_url,steps:[.steps[]|{number,name,status,conclusion}]}]}' \
            > deployment-status/actions.json

          cat deployment-status/actions.json

      - name: Salvar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status/actions.json
          git commit -m "ci: registrar diagnóstico dos workflows [skip ci]"
          git push origin main
