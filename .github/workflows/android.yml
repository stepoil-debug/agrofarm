name: Gerar Android

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Gerar AAB assinado para Google Play"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.1
      GODOT_STATUS: stable
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Godot
        run: |
          curl -L --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot

      - name: Instalar templates de exportação
        run: |
          curl -L --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      - name: Configurar Android SDK no Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=AgroFarm,C=BR" || true

      - name: Importar projeto
        run: timeout 120 godot --headless --path apps/agrofarm-godot --editor --quit

      - name: Gerar APK de teste
        if: ${{ !inputs.release }}
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cp "$HOME/.android/debug.keystore" "$GITHUB_WORKSPACE/.debug.keystore"
          mkdir -p build/android
          godot --headless --path apps/agrofarm-godot --export-debug "Android Debug" ../../build/android/AgroFarm-debug.apk

      - name: Preparar keystore de produção
        if: ${{ inputs.release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Secret ANDROID_KEYSTORE_BASE64 ausente" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/agrofarm-release.keystore"

      - name: Gerar AAB da Google Play
        if: ${{ inputs.release }}
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/agrofarm-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" || (echo "Secret ANDROID_KEYSTORE_USER ausente" && exit 1)
          test -n "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" || (echo "Secret ANDROID_KEYSTORE_PASSWORD ausente" && exit 1)
          mkdir -p build/android
          godot --headless --path apps/agrofarm-godot --export-release "Google Play" ../../build/android/AgroFarm-release.aab

      - name: Enviar pacote Android
        uses: actions/upload-artifact@v4
        with:
          name: agrofarm-android
          path: build/android/*
          if-no-files-found: error
