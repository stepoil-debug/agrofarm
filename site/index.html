<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b3516">
  <link rel="manifest" href="manifest.json">
  <title>Agro Farm 3D</title>
  <style>
    :root{--green:#0d4b21;--light:#9ee06e;--gold:#f3c756;--wood:#6c3b17;--panel:rgba(6,28,12,.92);--stroke:rgba(255,255,255,.25)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07130b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:none;user-select:none}
    button,input{font:inherit} button{border:1px solid var(--stroke);background:linear-gradient(#1a6f31,#0d4b21);color:white;border-radius:16px;padding:12px 18px;font-weight:900;box-shadow:0 8px 0 rgba(0,0,0,.25);cursor:pointer;text-shadow:0 2px 0 #000}button:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.25)}button.secondary{background:linear-gradient(#734119,#4b270d)}button.gold{background:linear-gradient(#ffd66d,#b96e15);color:#291300;text-shadow:none}button:disabled{filter:grayscale(1) brightness(.65);opacity:.7}
    .screen{position:fixed;inset:0;display:none}.screen.active{display:block}.cover{background:radial-gradient(circle at 50% 25%,rgba(255,218,117,.35),transparent 35%),linear-gradient(180deg,rgba(51,160,77,.4),rgba(7,19,11,.95)),url('') center/cover no-repeat;overflow:hidden}.cover:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.08),transparent 35%,rgba(0,0,0,.25)),radial-gradient(circle at 15% 80%,#1b7a32 0 10%,transparent 25%),radial-gradient(circle at 85% 75%,#c18b35 0 12%,transparent 28%)}
    .brand{position:absolute;left:50%;top:7%;transform:translateX(-50%);text-align:center;z-index:2}.logo{font-size:clamp(52px,8vw,116px);line-height:.82;font-weight:1000;letter-spacing:-4px;text-transform:uppercase;text-shadow:0 8px 0 #3b210a,0 13px 24px rgba(0,0,0,.55)}.logo b{display:block;color:#8bd235;text-shadow:0 8px 0 #173b07,0 13px 24px rgba(0,0,0,.55)}.slogan{margin-top:18px;background:#b56c21;color:#180d03;padding:10px 26px;border-radius:14px;font-weight:1000;letter-spacing:1px;border:3px solid #f5d37a}
    .heroes{position:absolute;left:50%;bottom:9%;width:min(850px,94vw);height:52%;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;gap:min(6vw,70px);z-index:1}.hero{width:min(34vw,270px);height:100%;border-radius:40px 40px 8px 8px;background:linear-gradient(160deg,#70451f,#291205);border:2px solid rgba(255,255,255,.2);box-shadow:0 28px 60px rgba(0,0,0,.45);position:relative;overflow:hidden}.hero:before{content:"";position:absolute;left:50%;top:8%;width:42%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:#f0b47a;box-shadow:0 -42px 0 12px #6b3c19,0 18px 0 52px #2e7836}.hero:after{content:"";position:absolute;left:50%;bottom:0;width:70%;height:55%;transform:translateX(-50%);background:linear-gradient(90deg,#1e4e82 0 47%,#14395f 47% 53%,#1e4e82 53%);border-radius:28px 28px 0 0}.hero.fem:before{box-shadow:0 -42px 0 12px #6b3c19,0 18px 0 52px #8e3e25}.hero.fem{height:96%}.cover-actions{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);display:flex;gap:12px;z-index:3;flex-wrap:wrap;justify-content:center}.badge{position:absolute;right:24px;bottom:26px;background:#0d7c28;border:3px solid #d7c35a;border-radius:18px;padding:12px;text-align:center;font-weight:1000;z-index:3}
    .setup-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,92vw);background:var(--panel);border:1px solid var(--stroke);border-radius:28px;padding:24px;box-shadow:0 20px 80px rgba(0,0,0,.55)}.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.portrait-select{display:grid;grid-template-columns:1fr 1fr;gap:12px}.portrait{border:3px solid rgba(255,255,255,.18);border-radius:24px;min-height:230px;background:linear-gradient(160deg,#4c2f18,#111);display:flex;flex-direction:column;align-items:center;justify-content:end;padding:18px;cursor:pointer}.portrait.selected{border-color:var(--gold);box-shadow:0 0 0 4px rgba(243,199,86,.25)}.minihero{width:110px;height:170px;border-radius:30px 30px 8px 8px;background:#633813;position:relative;margin-bottom:12px}.minihero:before{content:"";position:absolute;left:50%;top:18px;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;background:#f0b47a;box-shadow:0 -22px 0 9px #5c3215,0 48px 0 42px #2e7836}.portrait.fem .minihero:before{box-shadow:0 -22px 0 9px #5c3215,0 48px 0 42px #8e3e25} input{width:100%;padding:15px;border-radius:16px;border:1px solid var(--stroke);background:#fff;color:#111;font-weight:800;font-size:18px}
    .game{background:#132515}.world{position:absolute;inset:64px 0 84px 0;perspective:900px;overflow:hidden;background:linear-gradient(#76c84b,#3a8f29)}.terrain{position:absolute;left:50%;top:53%;width:850px;height:520px;transform:translate(-50%,-50%) rotateX(56deg) rotateZ(45deg);transform-style:preserve-3d;background:repeating-linear-gradient(0deg,#46a72d 0 26px,#3e9f29 26px 52px),repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 2px,transparent 2px 52px);border-radius:40px;box-shadow:0 40px 80px rgba(0,0,0,.35)}.road{position:absolute;background:#d9ac57;border-radius:24px;box-shadow:inset 0 0 0 5px rgba(255,238,153,.25)}.road.r1{left:335px;top:-20px;width:115px;height:560px}.road.r2{left:120px;top:240px;width:650px;height:110px}.building{position:absolute;transform:translateZ(50px) rotateZ(-45deg);width:128px;height:94px;border-radius:14px;background:#815023;box-shadow:0 10px 0 #42240e,0 20px 30px rgba(0,0,0,.35);display:grid;place-items:center;font-weight:1000;text-align:center}.house{left:70px;top:72px}.shop{right:95px;top:60px;background:#9b6329}.coop{left:58px;bottom:55px;background:#73411c}.field-grid{position:absolute;left:330px;top:210px;width:310px;display:grid;grid-template-columns:repeat(6,48px);gap:8px;transform:translateZ(34px)}.plot{height:48px;border-radius:8px;background:#835326;border:3px solid #4b2a10;display:grid;place-items:center;color:#fff;font-weight:1000;transform:rotateZ(-45deg);box-shadow:0 5px 0 #361b08}.plot.lock{background:#1d391d;color:#8aa58a}.plot.crop{background:#5fb236}.plot.ready{background:#f3c756;color:#382000}.player{position:absolute;left:52%;top:50%;transform:translate(-50%,-50%);width:72px;height:116px;border-radius:30px 30px 10px 10px;background:#6f421d;box-shadow:0 20px 30px rgba(0,0,0,.35);z-index:4}.player:before{content:"";position:absolute;left:50%;top:10px;width:38px;height:38px;border-radius:50%;transform:translateX(-50%);background:#f0b47a;box-shadow:0 -16px 0 8px #5c3215,0 46px 0 30px #2e7836}.player.fem:before{box-shadow:0 -16px 0 8px #5c3215,0 46px 0 30px #8e3e25}.hud{position:absolute;left:0;right:0;top:0;height:64px;background:rgba(5,26,9,.85);display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--stroke)}.hud .center{margin:auto;font-weight:1000;text-align:center;line-height:1}.hud strong{display:block;font-size:22px}.hud small{font-size:13px;color:#d8ffd3}.bottom{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(5,26,9,.88);display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px solid var(--stroke)}.minimap{position:absolute;left:18px;top:82px;width:210px;height:136px;background:#143e1e;border:3px solid #cfecc8;border-radius:18px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:8}.minimap h4{margin:0 0 6px;text-align:center;color:#f6d966}.minimap .mapbody{height:86px;border-radius:12px;background:linear-gradient(90deg,#3aa840 0 62%,#d9ac57 62% 72%,#8b5a2b 72%);position:relative;overflow:hidden}.pin{position:absolute;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:1000;border:2px solid #fff}.pin.me{left:38%;top:45%;background:#fff;color:#111}.pin.shop{right:10%;top:18%;background:#f6d966;color:#111}.pin.home{left:12%;top:18%;background:#8bd235;color:#111}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,92vw);max-height:78vh;overflow:auto;background:var(--panel);border:1px solid var(--stroke);border-radius:28px;padding:20px;box-shadow:0 20px 80px rgba(0,0,0,.55);z-index:20;display:none}.panel.active{display:block}.panel h2{margin:0 0 14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:rgba(255,255,255,.08);border:1px solid var(--stroke);border-radius:18px;padding:14px}.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:#111;color:#fff;padding:14px 22px;border-radius:16px;font-weight:900;z-index:30;display:none}.toast.show{display:block}.status{margin-left:auto;color:#e9ffd9;font-weight:800}@media(max-width:760px){.setup-grid{grid-template-columns:1fr}.brand{top:4%}.heroes{height:42%}.hud strong{font-size:18px}.bottom button{padding:10px 12px;font-size:13px}.minimap{width:170px;height:118px}.field-grid{grid-template-columns:repeat(6,40px);gap:7px}.plot{height:40px}}
  </style>
</head>
<body>
  <section id="cover" class="screen cover active">
    <div class="brand"><div class="logo">Agro <b>Farm</b></div><div class="slogan">O JOGO DO PRODUTOR BRASILEIRO</div></div>
    <div class="heroes"><div class="hero"></div><div class="hero fem"></div></div>
    <div class="cover-actions"><button class="gold" onclick="openSetup()">NOVO JOGO</button><button onclick="continueGame()">CONTINUAR</button></div>
    <div class="badge">FEITO PARA<br>O BRASIL</div>
  </section>
  <section id="setup" class="screen">
    <div class="setup-card">
      <h1>Crie seu produtor</h1>
      <div class="setup-grid">
        <div><label>Nome do personagem</label><input id="playerName" maxlength="16" placeholder="Ex: Douglas"><br><br><button class="gold" onclick="startGame()">COMEÇAR FAZENDA</button><button class="secondary" onclick="goCover()">VOLTAR</button></div>
        <div class="portrait-select"><div id="maleChoice" class="portrait selected" onclick="selectGender('masculino')"><div class="minihero"></div><strong>Masculino</strong></div><div id="femaleChoice" class="portrait fem" onclick="selectGender('feminino')"><div class="minihero"></div><strong>Feminino</strong></div></div>
      </div>
    </div>
  </section>
  <section id="game" class="screen game">
    <div class="hud"><button onclick="showPanel('map')">MAPA</button><button onclick="showPanel('menu')">MENU</button><div class="center"><strong id="loc">FAZENDA</strong><small id="sub">LOTE INICIAL</small></div><div id="stats" class="status"></div></div>
    <div class="world"><div class="terrain"><div class="road r1"></div><div class="road r2"></div><div class="building house">CASA</div><div class="building shop">LOJA</div><div class="building coop">GALINHEIRO</div><div id="fields" class="field-grid"></div></div><div id="player" class="player"></div></div>
    <div class="minimap"><h4>MAPA</h4><div class="mapbody"><span class="pin home">C</span><span class="pin me">EU</span><span class="pin shop">L</span></div></div>
    <div class="bottom"><button onclick="showPanel('lots')">PLANTE</button><button onclick="waterAll()">CUIDE</button><button onclick="harvestAll()">COLHA</button><button onclick="showPanel('shop')">LOJA</button><button class="gold" onclick="nextDay()">DORMIR</button></div>
    <div id="panel" class="panel"></div><div id="toast" class="toast"></div>
  </section>
<script>
const stateDefault={name:'',gender:'masculino',money:2000,day:1,energy:100,unlocked:4,plots:Array.from({length:36},(_,i)=>({u:i<4,c:'',s:0,w:false})),structures:{coop:false,stable:false,pigsty:false,silo:false,barn:false},animals:[]};let S=load()||structuredClone(stateDefault);let gender='masculino';
function save(){localStorage.setItem('agrofarm3d',JSON.stringify(S))}function load(){try{return JSON.parse(localStorage.getItem('agrofarm3d'))}catch(e){return null}}function screen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}function openSetup(){screen('setup')}function goCover(){screen('cover')}function selectGender(g){gender=g;document.getElementById('maleChoice').classList.toggle('selected',g==='masculino');document.getElementById('femaleChoice').classList.toggle('selected',g==='feminino')}function startGame(){S=structuredClone(stateDefault);S.name=document.getElementById('playerName').value.trim()||'Produtor';S.gender=gender;S.plots.forEach((p,i)=>p.u=i<S.unlocked);save();enterGame()}function continueGame(){S=load()||S;if(!S.name)return openSetup();enterGame()}function enterGame(){screen('game');document.getElementById('player').className='player '+(S.gender==='feminino'?'fem':'');render()}function money(v){if(S.money<v){toast('Saldo insuficiente');return false}S.money-=v;return true}function render(){document.getElementById('stats').textContent=`${S.name} | $${S.money} | Dia ${S.day} | Energia ${S.energy}%`;const f=document.getElementById('fields');f.innerHTML='';S.plots.forEach((p,i)=>{let d=document.createElement('button');d.className='plot '+(!p.u?'lock':p.c?(p.s>=3?'ready':'crop'):'');d.textContent=!p.u?'🔒':p.c?(p.s>=3?'✅':'🌱'):'';d.onclick=()=>plotAction(i);f.appendChild(d)});save()}function plotAction(i){let p=S.plots[i];if(!p.u)return;if(!p.c){if(money(8)){p.c='Milho';p.s=0;p.w=false;toast('Milho plantado')}}else if(p.s>=3){S.money+=25;p.c='';p.s=0;p.w=false;toast('Colheita vendida +$25')}else{p.w=true;toast('Lote molhado')}render()}function waterAll(){S.plots.filter(p=>p.u&&p.c&&p.s<3).forEach(p=>p.w=true);toast('Lotes cuidados');render()}function harvestAll(){let n=0;S.plots.forEach(p=>{if(p.u&&p.c&&p.s>=3){n++;p.c='';p.s=0;p.w=false}});S.money+=n*25;toast(n?`Colheita vendida +$${n*25}`:'Nada pronto para colher');render()}function nextDay(){S.day++;S.energy=100;S.plots.forEach(p=>{if(p.u&&p.c&&p.w&&p.s<3)p.s++;p.w=false});if(S.animals.length){S.money+=S.animals.length*10;toast(`Produção animal +$${S.animals.length*10}`)}else toast('Novo dia');render()}function expand(){if(S.unlocked>=36)return toast('Todos os lotes liberados');let price=Math.floor(500*Math.pow(1.35,S.unlocked-4));if(money(price)){S.plots[S.unlocked].u=true;S.unlocked++;toast('Campo expandido')}showPanel('lots');render()}function buyStruct(k,price,name){if(S.structures[k])return;if(money(price)){S.structures[k]=true;toast(name+' comprado')}showPanel('shop');render()}function buyAnimal(type,price,req){if(!S.structures[req])return toast('Compre a construção primeiro');if(money(price)){S.animals.push(type);toast(type+' comprado')}showPanel('animals');render()}function showPanel(t){const p=document.getElementById('panel');p.classList.add('active');let h='';if(t==='menu')h=`<h2>Menu</h2><div class="cards"><button onclick="showPanel('lots')">🌾 LOTES</button><button onclick="showPanel('shop')">🏗️ CONSTRUÇÕES</button><button onclick="showPanel('animals')">🐄 ANIMAIS</button><button onclick="showPanel('map')">🗺️ MAPA</button><button onclick="save();toast('Jogo salvo')">💾 SALVAR</button><button class="secondary" onclick="closePanel()">FECHAR</button></div>`;if(t==='lots')h=`<h2>Lotes ${S.unlocked}/36</h2><p>Plante milho, molhe e durma para crescer. Clique no lote para plantar, cuidar ou colher.</p><button class="gold" onclick="expand()">COMPRAR CAMPO +1 ($${Math.floor(500*Math.pow(1.35,S.unlocked-4))})</button>`;if(t==='shop')h=`<h2>Construções</h2><div class="cards">${card('Galinheiro',500,'coop')} ${card('Estábulo',1200,'stable')} ${card('Chiqueiro',800,'pigsty')} ${card('Silo',350,'silo')} ${card('Galpão',700,'barn')}</div>`;if(t==='animals')h=`<h2>Animais</h2><div class="cards"><button onclick="buyAnimal('Galinha',300,'coop')">🐔 Galinha $300</button><button onclick="buyAnimal('Vaca',1500,'stable')">🐄 Vaca $1500</button><button onclick="buyAnimal('Porco',900,'pigsty')">🐷 Porco $900</button></div><p>Animais: ${S.animals.join(', ')||'nenhum'}</p>`;if(t==='map')h=`<h2>Mapa da Fazenda</h2><p>🌾 Fazenda → 🛤️ Estrada → 🏪 Loja/Cidade</p><p>Próximas áreas: floresta, rio, montanha, fábrica de processamento e feira.</p>`;p.innerHTML=h+'<br><button class="secondary" onclick="closePanel()">FECHAR</button>'}function card(n,c,k){return `<button ${S.structures[k]?'disabled':''} onclick="buyStruct('${k}',${c},'${n}')">${n} ${S.structures[k]?'✅':'$'+c}</button>`}function closePanel(){document.getElementById('panel').classList.remove('active')}function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1700)}
if(S.name){};
</script>
</body>
</html>
